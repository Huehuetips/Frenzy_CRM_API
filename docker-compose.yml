name: frenzy-crm
services:
  api:
    container_name: frenzy-crm-api
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://frenzy_crm:frenzy_crm_password@postgres:5432/frenzy_crm?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh docker/entrypoint.dev.sh

  postgres:
    container_name: frenzy-crm-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frenzy_crm}
      POSTGRES_USER: ${POSTGRES_USER:-frenzy_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frenzy_crm_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frenzy_crm} -d ${POSTGRES_DB:-frenzy_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
